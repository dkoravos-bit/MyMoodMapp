# Sentry CLI configuration used by @sentry/react-native/expo during EAS build.
# Auth token is injected via SENTRY_AUTH_TOKEN environment variable in EAS secrets
# (never commit a real token here).
#
# Set these in your EAS project secrets:
#   SENTRY_AUTH_TOKEN  — from https://sentry.io/settings/account/api/auth-tokens/
#
defaults.url=https://sentry.io/
defaults.org=maverick-investments-llc
defaults.project=apple-ios
